[package]
name = "server-desk"
version = "0.1.0"
description = "服务器统一桌面控制中心"
authors = ["ServerDesk"]
edition = "2021"

[lib]
name = "server_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 4
lto = false
opt-level = "s"
strip = true

[dependencies.argon2]
version = "0.5"

[dependencies.aes-gcm]
version = "0.10"

[dependencies.hkdf]
version = "0.12"

[dependencies.sha2]
version = "0.10"

[dependencies.rand]
version = "0.8"

[dependencies.zeroize]
version = "1"

[dependencies.base64]
version = "0.22"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Graphics_Dwm"]
